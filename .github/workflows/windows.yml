name: Windows build and integration checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.tools/nuget
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Shunshou.slnx
      - name: Fetch verified offline processing components
        shell: pwsh
        run: |
          ./scripts/Download-Runtime.ps1
          ./scripts/Download-OcrModels.ps1
      - name: Build
        run: dotnet build Shunshou.slnx -c Release --no-restore
      - name: Verify generated documents, images, archives, audio and video
        run: dotnet run --project tests/Shunshou.SmokeTests -c Release --no-build -- artifacts/smoke
      - name: Build portable package
        shell: pwsh
        run: ./scripts/Build-Portable.ps1
