name: Windows build and integration checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.tools/nuget
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Shunshou.slnx
      - name: Fetch verified offline processing components
        shell: pwsh
        run: |
          ./scripts/Download-Runtime.ps1
          ./scripts/Download-OcrModels.ps1
      - name: Build
        run: dotnet build Shunshou.slnx -c Release --no-restore
      - name: Verify generated documents, images, archives, audio and video
        run: dotnet run --project tests/Shunshou.SmokeTests -c Release --no-build -- artifacts/smoke
      - name: Verify deployment and shortcut isolation
        shell: pwsh
        run: |
          dotnet run --project tests/Shunshou.Deployment.Tests -c Release --no-build -- artifacts/deployment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Shunshou.DesktopIntegration.Tests -c Release --no-build -- artifacts/desktop-integration
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build portable package
        shell: pwsh
        run: |
          ./scripts/Build-Portable.ps1
          $portableVersion = ([xml](Get-Content -LiteralPath ./Directory.Build.props -Raw)).Project.PropertyGroup.Version
          $portableRoot = Join-Path $PWD "dist/ShunshouToolbox-$portableVersion-win-x64"
          foreach ($entry in @('ShunshouToolbox.exe', 'ShunshouToolbox.pri', 'Usage.md')) {
            if (-not (Test-Path -LiteralPath (Join-Path $portableRoot $entry) -PathType Leaf)) { throw "Portable entry is missing: $entry" }
          }
          if (Test-Path -LiteralPath (Join-Path $portableRoot '顺手工具箱.exe')) { throw 'New portable package still includes the obsolete Chinese apphost.' }
      - name: Build offline self-extracting package
        shell: pwsh
        run: ./scripts/Build-Setup.ps1
      - name: Verify final self-extracting EXE in an isolated directory
        shell: pwsh
        run: |
          $setupVersion = ([xml](Get-Content -LiteralPath ./Directory.Build.props -Raw)).Project.PropertyGroup.Version
          $setupExe = Join-Path $PWD "dist/ShunshouToolbox-$setupVersion-win-x64-setup.exe"
          $setupProcess = Start-Process -FilePath $setupExe -ArgumentList '--verify-setup', 'artifacts/setup-package' -WorkingDirectory $PWD -PassThru -WindowStyle Hidden
          $setupProcess.WaitForExit()
          if ($setupProcess.ExitCode -ne 0) { throw "Setup verification exited $($setupProcess.ExitCode)." }
          $setupReport = Get-Content -LiteralPath ./artifacts/setup-package/setup-verification.json -Raw | ConvertFrom-Json
          if (-not $setupReport.Passed) { throw 'Setup verification did not pass.' }
